name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'setel/pubspec.yaml'
      - 'setel/android/**'
      - '.github/workflows/auto_release.yml'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Get pub dependencies
        working-directory: ./setel
        run: flutter pub get

      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' setel/pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $VERSION | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_TAG=v$VERSION_NAME" >> $GITHUB_ENV
          echo "Mendeteksi versi: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Setup Release Keystore & key.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > setel/android/app/setel-release.jks
            cat <<EOF > setel/android/key.properties
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyPassword=${{ secrets.KEY_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
storeFile=setel-release.jks
EOF
            echo "Keystore decoded to setel/android/app/setel-release.jks and key.properties created."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, falling back to debug signing."
          fi

      - name: Build APK
        working-directory: ./setel
        run: |
          flutter build apk --release -v > build_log.txt 2>&1 || {
            echo "::error::Build failed! Saving log as artifact..."
            exit 1
          }

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: setel/build_log.txt

      - name: Rename APK
        run: mv setel/build/app/outputs/flutter-apk/app-release.apk Setel.apk

      - name: Update version.json
        run: |
          cat <<EOF > version.json
          {
            "version_code": ${{ env.VERSION_CODE }},
            "version_name": "${{ env.VERSION_NAME }}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION_TAG }}/Setel.apk",
            "changelog": "Pembaruan otomatis dari GitHub Actions versi ${{ env.VERSION_TAG }}.",
            "force_update": false
          }
          EOF
          cp version.json setel/version.json

      - name: Commit version.json back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json setel/version.json
          git commit -m "chore: auto-update version.json to ${{ env.VERSION_TAG }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Setel ${{ env.VERSION_TAG }}"
          body: "Pembaruan otomatis Setel Music Streaming ke versi ${{ env.VERSION_TAG }} (Build ${{ env.VERSION_CODE }})"
          files: Setel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
